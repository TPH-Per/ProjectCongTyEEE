  height: 20px;

    right: -4px;
  }
}

/* === LAYOUT IMPROVEMENTS === */

.header-toolbar {

  align-items: center;

  border-bottom: 1px solid #404040;
  gap: 16px;

.header-toolbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.header-toolbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Group buttons theo chức năng */
.button-group {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-right: 1px solid #404040;
}

.button-group:last-child {
  border-right: none;
}

/* Separator giữa các nhóm */
.button-separator {
  width: 1px;
  height: 32px;
  background: #404040;
  margin: 0 8px;

/* === ACCESSIBILITY === */

.header-btn:focus-visible {

  outline-offset: 2px;
}

/* Screen Reader */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

    border: 2px solid white;

  }

/* Touch Targets (Mobile) */
@media (max-width: 768px) {
  .header-btn {
    min-height: 44px; /* iOS minimum */
    min-width: 44px;
  }
}

}
.k-tabs button:hover { color: var(--kawaii-navy-700); }
.k-tabs button.is-active {
  background: var(--kawaii-grad);
  color: #fff;
  box-shadow: 0 6px 14px rgba(255, 90, 110, 0.25);
}

/* ---------- 15. Avatars & decorations ---------- */
.k-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--kawaii-grad);
  color: #fff;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 0.4px;
  box-shadow: 0 4px 10px rgba(255, 90, 110, 0.3);
}

.k-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 2px solid var(--kawaii-pink-100);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  color: var(--kawaii-navy-700);
  transition: border-color .15s ease;
}
.k-chip:hover { border-color: var(--kawaii-pink-200); }

/* ---------- 16. Loading skeleton ---------- */
@keyframes k-shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
.k-skeleton {
  display: block;
  background: linear-gradient(90deg, #FFE3E6 0%, #FFF5F7 50%, #FFE3E6 100%);
  background-size: 400px 100%;
  animation: k-shimmer 1.4s infinite linear;
  border-radius: 8px;
}

/* ---------- 17. Animations ---------- */
@keyframes k-fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes k-pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes k-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 123, 137, 0.45); }
  50%      { box-shadow: 0 0 0 12px rgba(255, 123, 137, 0); }
}
.k-fade-in { animation: k-fade-in .35s var(--kawaii-ease) both; }
.k-pop     { animation: k-pop .35s var(--kawaii-ease) both; }
.k-pulse   { animation: k-pulse 1.8s infinite; }

/* ---------- 18. Utilities ---------- */
.k-divider {
  height: 1px;
  background: var(--kawaii-pink-100);
  margin: 12px 0;
}
.k-section-title {
  font-size: 14px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--kawaii-navy-500);
}
.k-text-muted { color: var(--kawaii-navy-500); }
.k-text-pink  { color: var(--kawaii-pink-600); }

/* ---------- 19. Responsive helpers ---------- */
@media (max-width: 640px) {
  .k-options { grid-template-columns: 1fr; }
  .k-card__header { padding: 12px 16px; }
  .k-card__body { padding: 16px; }
